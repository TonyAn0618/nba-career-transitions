name: Build and publish Shot Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shot-atlas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Cache the pinned NBA snapshot
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            public/data/nba.json
            public/data/shots
          key: nba-v1-${{ runner.os }}-${{ hashFiles('data/**', 'scripts/**', 'src/lib/player-photos.json', 'package-lock.json') }}
      - run: npm run build
      - run: npm test
        env:
          NBA_SHOT_RECONCILE_2016: '1'
      - run: npm run check:data
      - run: npm run check:shots
      - name: Package the website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish the website
        id: pages
        uses: actions/deploy-pages@v4
